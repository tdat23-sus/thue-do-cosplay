<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiyoo Shop - Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f6;
            color: #29252a;
        }
        .topbar {
            background: #3a2632;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .brand { font-size: 21px; font-weight: 800; }
        .top-actions { display: flex; gap: 8px; }
        button, .link-button {
            border: 0;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-light { background: white; color: #3a2632; }
        .btn-primary { background: #8d4968; color: white; }
        .btn-danger { background: #b33b4b; color: white; }
        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 16px 50px;
        }
        .notice {
            padding: 14px 16px;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 18px;
            border: 1px solid #e6dfe3;
        }
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
        }
        .panel {
            background: white;
            border: 1px solid #e6dfe3;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
        }
        h1, h2 { margin-top: 0; }
        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 700;
        }
        input, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d8cfd4;
            border-radius: 10px;
            font: inherit;
            outline: none;
        }
        textarea { min-height: 100px; resize: vertical; }
        input:focus, textarea:focus {
            border-color: #8d4968;
        }
        .upload-box {
            border: 2px dashed #d4c1ca;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-top: 8px;
        }
        .preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #f1edef;
            border-radius: 10px;
            margin-top: 12px;
            display: none;
        }
        .help {
            font-size: 13px;
            color: #746b70;
            margin-top: 6px;
        }
        .character-list {
            display: grid;
            gap: 12px;
        }
        .character-row {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 12px;
            align-items: center;
            border: 1px solid #e7e0e4;
            border-radius: 12px;
            padding: 10px;
        }
        .character-row img {
            width: 110px;
            height: 75px;
            object-fit: contain;
            background: #f3f0f1;
            border-radius: 8px;
        }
        .muted { color: #766e73; font-size: 13px; }
        .status { font-size: 12px; font-weight: 700; }
        .status.active { color: #25824a; }
        .status.hidden-status { color: #a34d58; }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .loading { opacity: .65; pointer-events: none; }
        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; }
            .character-row {
                grid-template-columns: 85px 1fr;
            }
            .character-row img {
                width: 85px;
                height: 65px;
            }
            .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">Chiyoo Shop — Admin</div>
    <div class="top-actions">
        <button class="btn-light" onclick="goShop()">Xem shop</button>
        <button class="btn-light" onclick="logout()">Đăng xuất</button>
    </div>
</header>

<main>
    <div id="access-notice" class="notice">
        Đang kiểm tra quyền admin...
    </div>

    <div id="admin-content" class="grid" style="display:none;">

        <section class="panel">
            <h2>Thêm nhân vật</h2>
            <p class="muted">
                Admin có thể chọn ảnh trực tiếp từ máy. Ảnh sẽ được lưu vào Supabase Storage.
            </p>

            <form id="character-form">

                <label for="name">Tên nhân vật *</label>
                <input id="name" required placeholder="Ví dụ: Sinestrea">

                <label for="category">Thể loại</label>
                <input id="category" placeholder="Ví dụ: Genshin Impact">

                <label for="price">Giá thuê / ngày *</label>
                <input id="price" required placeholder="Ví dụ: 300.000đ / ngày">

                <label for="description">Mô tả</label>
                <textarea id="description" placeholder="Mô tả bộ cosplay..."></textarea>

                <label for="items">Các món đi kèm</label>
                <textarea id="items" placeholder="Mỗi món một dòng&#10;Trang phục&#10;Tóc giả&#10;Phụ kiện"></textarea>

                <label>Ảnh nhân vật *</label>
                <div class="upload-box">
                    <input id="image" type="file" accept="image/*" required>
                    <img id="preview" class="preview" alt="Xem trước">
                    <div class="help">
                        Nên dùng ảnh ngang để hiển thị đẹp trên shop.
                    </div>
                </div>

                <label>
                    <input id="is-active" type="checkbox" checked style="width:auto;">
                    Hiển thị nhân vật trên website
                </label>

                <button id="save-button" class="btn-primary" type="submit">
                    Upload ảnh & lưu nhân vật
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Nhân vật hiện có</h2>
            <div id="character-list" class="character-list">
                Đang tải...
            </div>
        </section>

    </div>
</main>

<script src="admin.js"></script>
</body>
</html>
