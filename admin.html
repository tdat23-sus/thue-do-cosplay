<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chiyoo Shop — Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        header p {
            margin: 5px 0 0;
            opacity: .75;
            font-size: 13px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-light {
            background: white;
            color: #222;
        }

        .btn-dark {
            background: #222;
            color: white;
        }

        main {
            width: min(1100px, calc(100% - 30px));
            margin: 25px auto 50px;
        }

        .admin-message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .admin-message.success {
            background: #e9f9ee;
            color: #176b32;
        }

        .admin-message.error {
            background: #ffe9ed;
            color: #a51d35;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,.06);
        }

        .panel h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #888;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .image-preview-box {
            margin-top: 10px;
        }

        #image-preview {
            display: none;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #f1f1f1;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .submit-button {
            margin-top: 20px;
            background: #111;
            color: white;
            width: 100%;
            font-size: 15px;
        }

        .submit-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #character-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .admin-character-card {
            border: 1px solid #eee;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .admin-character-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #f1f1f1;
            display: block;
        }

        .admin-character-no-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .admin-character-info {
            padding: 15px;
        }

        .admin-character-info h3 {
            margin: 0 0 6px;
        }

        .admin-character-info p {
            margin: 6px 0;
            color: #666;
            font-size: 14px;
        }

        .admin-character-info button {
            margin-top: 8px;
            background: #eee;
        }

        #access-notice {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,.06);
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            #character-list {
                grid-template-columns: 1fr;
            }

            main {
                width: min(100% - 20px, 1100px);
                margin-top: 15px;
            }

            .panel {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1>Chiyoo Shop — Admin</h1>
        <p>Xin chào, <span id="admin-name">Admin</span></p>
    </div>

    <div class="header-buttons">
        <button
            id="shop-button"
            class="btn-light"
            type="button"
        >
            Xem shop
        </button>

        <button
            id="logout-button"
            class="btn-dark"
            type="button"
        >
            Đăng xuất
        </button>
    </div>
</header>

<main>

    <!-- THÔNG BÁO -->
    <div
        id="admin-message"
        class="admin-message"
    ></div>

    <!-- KIỂM TRA QUYỀN -->
    <div
        id="access-notice"
        style="display:none;"
    >
        <h2>Đang kiểm tra quyền...</h2>
        <p>Vui lòng chờ một chút.</p>
    </div>

    <!-- NỘI DUNG ADMIN -->
    <div
        id="admin-content"
        style="display:none;"
    >

        <!-- THÊM NHÂN VẬT -->
        <section class="panel">

            <h2>➕ Thêm nhân vật</h2>

            <form id="character-form">

                <div class="form-grid">

                    <!-- TÊN -->
                    <div class="form-group">
                        <label for="character-name">
                            Tên nhân vật
                        </label>

                        <input
                            type="text"
                            id="character-name"
                            placeholder="Ví dụ: Hu Tao"
                            required
                        >
                    </div>

                    <!-- THỂ LOẠI -->
                    <div class="form-group">
                        <label for="character-category">
                            Thể loại
                        </label>

                        <input
                            type="text"
                            id="character-category"
                            placeholder="Ví dụ: Genshin Impact"
                            required
                        >
                    </div>

                    <!-- ĐỊA CHỈ -->
<div class="form-group">
    <label for="character-address">
        Địa chỉ đồ
    </label>

    <input
        type="text"
        id="character-address"
        placeholder="Ví dụ: Quận 1, TP.HCM"
        required
    >
</div>

                    <!-- ẢNH -->
                    <div class="form-group">
                        <label for="character-image">
                            Ảnh nhân vật
                        </label>

                        <input
                            type="file"
                            id="character-image"
                            accept="image/*"
                            required
                        >
                    </div>

                    <!-- MÔ TẢ -->
                    <div class="form-group full">
                        <label for="character-description">
                            Mô tả
                        </label>

                        <textarea
                            id="character-description"
                            placeholder="Mô tả về bộ cosplay..."
                        ></textarea>
                    </div>

                    <!-- PHỤ KIỆN -->
                    <div class="form-group full">
                        <label for="character-items">
                            Phụ kiện đi kèm
                        </label>

                        <textarea
                            id="character-items"
                            placeholder="Tóc giả&#10;Trang phục&#10;Phụ kiện..."
                        ></textarea>

                        <small>
                            Mỗi phụ kiện viết trên một dòng.
                        </small>
                    </div>

                    <!-- TRẠNG THÁI -->
                    <div class="form-group full">

                        <label>
                            <input
                                type="checkbox"
                                id="character-active"
                                checked
                            >

                            Hiển thị nhân vật trên shop
                        </label>

                    </div>

                    <!-- PREVIEW -->
                    <div class="form-group full">

                        <label>
                            Xem trước ảnh
                        </label>

                        <div class="image-preview-box">

                            <img
                                id="image-preview"
                                src=""
                                alt="Xem trước ảnh"
                            >

                        </div>

                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-button"
                >
                    Upload ảnh & lưu nhân vật
                </button>

            </form>

        </section>

        <!-- DANH SÁCH -->
        <section class="panel">

            <h2>📦 Nhân vật hiện có</h2>

            <div id="character-list">
                <p>Đang tải...</p>
            </div>

        </section>

    </div>

</main>

<script src="admin.js"></script>

</body>
</html>
